<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LanDrop</title>
<meta name="description" content="Self-hosted, Snapdrop-style file drop for your local network." />
<meta name="theme-color" content="#12161b" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="drop-overlay" class="drop-overlay hidden">
  <div class="drop-overlay-inner">Drop to send</div>
</div>

<header class="topbar">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3v10m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>LanDrop</span>
  </div>
  <button id="self-name" class="self-name" title="Click to rename this device">You are ...</button>
</header>

<main class="stage">
  <div id="empty-state" class="empty-state hidden">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <p>No other devices on this network yet.</p>
    <p class="empty-sub">Open LanDrop on another device connected to the same server.</p>
  </div>

  <div id="peer-field" class="peer-field">
    <div class="ripple r1"></div>
    <div class="ripple r2"></div>
    <div class="ripple r3"></div>
    <div class="you-node">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="3" y="4" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/>
        <path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
</main>

<div id="toasts" class="toasts"></div>

<!-- Incoming transfer notice template -->
<template id="tpl-toast">
  <div class="toast">
    <div class="toast-row">
      <div class="toast-icon"></div>
      <div class="toast-body">
        <div class="toast-title"></div>
        <div class="toast-sub"></div>
      </div>
    </div>
    <div class="toast-progress"><div class="toast-progress-bar"></div></div>
  </div>
</template>

<!-- Incoming file request: asks the user to Accept or Decline before anything transfers -->
<template id="tpl-request">
  <div class="toast request">
    <div class="toast-row">
      <div class="toast-icon"></div>
      <div class="toast-body">
        <div class="toast-title"></div>
        <div class="toast-sub"></div>
      </div>
    </div>
    <div class="request-actions">
      <button type="button" class="request-btn decline">Decline</button>
      <button type="button" class="request-btn accept">Accept</button>
    </div>
  </div>
</template>

<input type="file" id="file-input" multiple hidden />

<script src="/js/app.js"></script>
</body>
</html>
